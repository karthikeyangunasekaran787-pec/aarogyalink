<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AarogyaLink</title>
  <style>
    /*
     * Entry splash. The app's module graph (providers + route bundle) has to
     * load before React can mount, so this paints branded content immediately
     * instead of a blank white screen while those modules arrive. React
     * replaces #root's children on mount, so it clears itself with no cleanup.
     */
    #root > #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      background: #f6f9fa;
      font-family: "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #boot-splash img {
      height: 72px;
      width: auto;
      opacity: 0.9;
    }
    #boot-splash .boot-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #0f172a;
    }
    #boot-splash .boot-tag {
      font-size: 13px;
      font-weight: 500;
      color: #0f766e;
    }
    /*
     * No spinner, no progress bar: entering the app must not read as "loading".
     * The frame below is a static branded paint that React replaces the moment
     * it mounts — the entry routes are bundled eagerly, so there is no chunk
     * fetch to wait on and no loading fallback behind this frame. Only the
     * failure path below swaps it for a message.
     */
    #boot-splash .boot-error {
      margin: 4px 0 0;
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
    }
    #boot-splash .boot-hint {
      margin: 0;
      max-width: 34rem;
      font-size: 12px;
      line-height: 1.5;
      color: #64748b;
    }
    #boot-splash .boot-retry {
      margin-top: 8px;
      padding: 8px 18px;
      border: 0;
      border-radius: 8px;
      background: #0d9488;
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #boot-splash .boot-retry:hover {
      background: #0f766e;
    }
  </style>
  <script>
    /*
     * If the entry module never runs — Vite still warming up, a transform
     * failure, or an exception during module evaluation — React never mounts
     * and the splash above would spin forever. Swap it for a readable message
     * instead of leaving a permanently blank page.
     *
     * This is a no-op once the app is live: React removes the splash when it
     * mounts, and the guard only acts while that element is still present.
     */
    (function () {
      var shown = false;
      function fail(detail) {
        var splash = document.getElementById("boot-splash");
        if (!splash || shown) return;
        shown = true;
        // React removes the splash when it mounts, so an empty shell is the
        // only safe starting state — nil-out everything the loop leaves behind.
        splash.textContent = "";
        // Clear every appended child: keep removing from the end until each
        // has been handed off (avoids self-referential splice loops).
        while (splash.firstChild) splash.removeChild(splash.firstChild);
        function add(tag, className, text) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          // textContent, never innerHTML: the detail string is never parsed.
          node.textContent = text;
          splash.appendChild(node);
          return node;
        }
        var logo = add("img", "", "");
        logo.src = "/aarogyalink-logo.jpeg";
        logo.alt = "";
        add("div", "boot-name", "AarogyaLink");
        add("p", "boot-error", "The app could not finish starting.");
        add("p", "boot-hint", detail);
        add("button", "boot-retry", "Retry").addEventListener("click", function () {
          location.reload();
        });
      }
      window.addEventListener(
        "error",
        function (event) {
          var target = event.target;
          if (target && target !== window && (target.tagName === "SCRIPT" || target.tagName === "LINK")) {
            fail("A required file failed to load. Check your connection and retry.");
          } else if (event.message) {
            fail(String(event.message));
          }
        },
        true,
      );
      window.addEventListener("unhandledrejection", function () {
        fail("An unexpected error interrupted startup.");
      });
    })();
  </script>
</head>

<body>
  <div id="root">
    <div id="boot-splash">
      <img src="/aarogyalink-logo.jpeg" alt="" onerror="this.style.display='none'" />
      <div class="boot-name">AarogyaLink</div>
      <div class="boot-tag">Closing the Rural Healthcare Loop</div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
